<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Tracker Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fafafa;
    }
    
    .header {
      padding: 16px;
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a3a3a3;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    
    .status-dot.offline {
      background: #ef4444;
    }
    
    .content {
      padding: 16px;
    }
    
    .device-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .device-item {
      background: #171717;
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .device-icon {
      width: 40px;
      height: 40px;
      background: #262626;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .device-info {
      flex: 1;
    }
    
    .device-name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    
    .device-meta {
      font-size: 11px;
      color: #a3a3a3;
      display: flex;
      gap: 8px;
    }
    
    .battery {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #737373;
    }
    
    .empty-state p {
      font-size: 13px;
      margin-bottom: 16px;
    }
    
    .btn {
      background: #fafafa;
      color: #0a0a0a;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }
    
    .btn:hover {
      background: #e5e5e5;
    }
    
    .btn-secondary {
      background: #262626;
      color: #fafafa;
      margin-top: 8px;
    }
    
    .btn-secondary:hover {
      background: #404040;
    }
    
    .btn-toggle {
      background: #262626;
      color: #a3a3a3;
      border: 1px solid #404040;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    
    .btn-toggle.active {
      background: #14532d;
      color: #86efac;
      border-color: #166534;
    }
    
    .btn-toggle:hover {
      background: #404040;
    }
    
    .btn-toggle.active:hover {
      background: #166534;
    }

    .toggle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a3a3a3;
      flex-shrink: 0;
    }

    .btn-toggle.active .toggle-dot {
      background: #22c55e;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #262626;
      font-size: 11px;
      color: #737373;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Device Tracker</h1>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Conectando...</span>
      </div>
    </div>
  </div>
  
  <div class="content">
    <div id="deviceList" class="device-list">
      <div class="empty-state">
        <p>No hay dispositivos detectados</p>
        <button class="btn" id="openFindMyDevice">Abrir Find My Device</button>
        <button class="btn btn-secondary" id="refreshBtn">Actualizar</button>
        <button class="btn btn-secondary" id="analyzeBtn">Analizar DOM (Debug)</button>
      </div>
    </div>
    <div id="analysisResult" style="display:none; margin-top: 12px; padding: 12px; background: #171717; border-radius: 8px; font-size: 11px; max-height: 200px; overflow-y: auto;">
      <pre id="analysisText" style="white-space: pre-wrap; word-break: break-all;"></pre>
    </div>
    <div style="margin-top: 12px;">
      <button class="btn btn-toggle" id="bgMonitorBtn">
        <span id="bgMonitorLabel">Monitoreo en segundo plano</span>
        <span class="toggle-dot" id="bgMonitorDot"></span>
      </button>
    </div>
  </div>
  
  <div class="footer">
    <span id="lastUpdate">Sin actualizar</span>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
